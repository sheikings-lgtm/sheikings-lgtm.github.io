<h1>掃描名片，存進自己的 Google 雲端</h1>
<p>ShinyCard 是一款 iPhone 和 Android 名片整理 App。拍下名片或從相簿選取照片，確認公司、姓名、職稱和電郵，也可以加上備註，記下認識對方的場合與後續事項。</p>
<h2>連接你的 Google 帳戶</h2>
<p>在 App 中選擇自己的 Google 帳戶並完成授權。按下儲存後，App 會將名片照片上傳到該帳戶的 Google Drive，並將聯絡資訊和照片連結寫入同一資料夾的 Google 試算表。</p>
<h2>聯絡支援</h2>
